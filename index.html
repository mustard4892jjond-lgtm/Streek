<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1c21">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<title>Streek</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet"></noscript>
<style>
:root{
  --bg:#0f1c21; --surface:#16272d; --surface2:#1d3239; --line:#27424b;
  --text:#e9f2f1; --muted:#8fa9ad; --accent:#4fc3b5; --flame:#ffa94d;
  --ok:#3fae7a; --okText:#06211d; --fail:#b85c5c; --failText:#fff;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme=dark]):not([data-theme=light]){--bg:#f2f6f5; --surface:#ffffff; --surface2:#e5eeed; --line:#cfdcdb; --text:#15262b; --muted:#5b7478; --accent:#17877a; --flame:#e07b00; --ok:#2e9e6b; --okText:#fff; --fail:#b04a4a;}
}
:root[data-theme=light]{--bg:#f2f6f5; --surface:#ffffff; --surface2:#e5eeed; --line:#cfdcdb; --text:#15262b; --muted:#5b7478; --accent:#17877a; --flame:#e07b00; --ok:#2e9e6b; --okText:#fff; --fail:#b04a4a;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Tajawal',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:17px;line-height:1.6}
body{min-height:100vh;padding:env(safe-area-inset-top) 0 0}
#app{max-width:480px;margin:0 auto;padding:20px 18px 130px}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:10px}
.top h1{font-size:22px;margin:0;font-weight:800}
.top small{color:var(--muted);font-size:15px}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:28px 20px 24px;text-align:center}
.flame{width:56px;height:56px}
.num{font-size:96px;font-weight:800;line-height:1;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.unit{font-size:19px;color:var(--muted);margin:0 0 14px}
.best{display:inline-block;background:var(--surface2);border-radius:999px;padding:4px 16px;font-size:15px;color:var(--muted)}
.cheer{margin:16px 0 0;font-size:17px}
.bar{height:8px;background:var(--surface2);border-radius:99px;margin:18px 6px 6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .5s}
.barlabel{font-size:14px;color:var(--muted)}
.study{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:18px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.study .snum{font-size:54px;font-weight:800;line-height:1}
.study .slabel{color:var(--muted);font-size:15px;margin:2px 0 8px}
.go{background:var(--surface2);border-radius:16px;padding:12px 14px;font-size:15px;text-align:center;max-width:140px;line-height:1.4}
.quote{margin:14px 0 0;padding:16px 18px;border-radius:20px;background:var(--surface);border:1px solid var(--line);font-size:17px}
.link{display:block;margin:20px auto 0;color:var(--muted);font-size:15px;text-decoration:underline;padding:8px}
.relapse{display:block;margin:30px auto 0;padding:10px 22px;border-radius:999px;border:1px solid var(--line);color:var(--muted);font-size:15px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:30}
.sheet{width:100%;max-width:480px;max-height:92vh;overflow:auto;background:var(--surface);border-radius:28px 28px 0 0;padding:26px 20px calc(24px + env(safe-area-inset-bottom));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.bar i{transition:none}}
.sheet h2{margin:0 0 8px;font-size:21px}
.sheet p{margin:0 0 18px;color:var(--muted)}
.btn{display:block;width:100%;padding:16px;border-radius:16px;font-weight:700;font-size:18px;text-align:center}
.primary{background:var(--accent);color:#06211d}
.small{margin-top:12px;padding:10px;color:var(--muted);font-size:15px;border-radius:12px;width:100%}
.small[disabled]{opacity:.45}
.btn[disabled]{opacity:.6}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.chip{padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface2)}
.chip.on{background:var(--accent);color:#06211d;border-color:var(--accent);font-weight:700}
textarea,input[type=date],input[type=text],input[type=time]{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:14px;color:var(--text);font-family:inherit;font-size:17px;padding:12px;margin-bottom:16px}
textarea{min-height:84px;resize:vertical}
.toast{position:fixed;inset-inline:16px;bottom:calc(84px + env(safe-area-inset-bottom));max-width:448px;margin:0 auto;background:var(--surface2);border:1px solid var(--line);border-radius:18px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;z-index:20}
.toast b{color:var(--accent);padding:6px 10px}
.setup{margin-top:40px;text-align:center}
.setup h2{font-size:26px;margin:0 0 8px}
.setup p{color:var(--muted);margin:0 0 22px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px 18px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:17px}
.muted{color:var(--muted)}

nav{position:fixed;bottom:0;inset-inline:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:10}
nav .in{max-width:480px;margin:0 auto;display:flex}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:var(--muted);font-size:12px;border-radius:14px}
nav button svg{width:25px;height:25px}
nav button.on{color:var(--accent);font-weight:700}

.prog{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px 18px;margin-bottom:14px}
.prog .t{display:flex;justify-content:space-between;font-weight:700}
.win{margin-top:10px;color:var(--ok);font-weight:700}
.task{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:8px 12px;margin-bottom:10px}
.chk{flex:none;width:34px;height:34px;border-radius:10px;border:2px solid var(--muted);display:grid;place-items:center}
.chk.on{background:var(--accent);border-color:var(--accent)}
.chk svg{width:20px;height:20px;opacity:0}
.chk.on svg{opacity:1}
.task .tt{flex:1;text-align:start;padding:10px 0;word-break:break-word}
.task.done .tt{color:var(--muted);text-decoration:line-through}
.edit{flex:none;color:var(--muted);font-size:14px;padding:8px}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
.addbtn{margin-top:6px}

.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.calhead h2{margin:0;font-size:20px}
.arrow{width:44px;height:44px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:22px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{text-align:center;color:var(--muted);font-size:12px;padding-bottom:4px}
.cell{aspect-ratio:1;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);font-size:16px;position:relative}
.cell.ok{background:var(--ok);color:var(--okText);border-color:var(--ok);font-weight:700}
.cell.fail{background:var(--fail);color:var(--failText);border-color:var(--fail);font-weight:700}
.cell.today{outline:3px solid var(--accent);outline-offset:1px}
.cell.blank{background:none;border:0}
.cell .dot{position:absolute;bottom:5px;width:6px;height:6px;border-radius:50%;background:var(--flame)}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:18px;color:var(--muted);font-size:14px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:5px;display:inline-block}

.sosbtn{display:block;width:100%;margin-top:14px;padding:18px;border-radius:18px;border:2px solid var(--accent);color:var(--accent);font-weight:800;font-size:26px;letter-spacing:4px;text-align:center}
.back{padding:8px 16px;border-radius:12px;background:var(--surface2);font-size:15px}
.back[disabled]{opacity:.5}
.lock{margin-top:0;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:20px;text-align:center}
.lock .lt{font-weight:800;font-size:19px;margin-bottom:4px}
.lnum{font-size:56px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.vwrap{margin-top:14px;text-align:center}
.vwrap .aud{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:16px;text-align:center}
.vwrap .ai{font-size:34px;line-height:1.2}
.vwrap audio{width:100%}
.sosc{padding:22px 20px;margin-top:14px}
.breath{text-align:center;margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:22px 20px}
.orb{width:150px;height:150px;border-radius:50%;margin:10px auto 16px;background:var(--surface2);border:3px solid var(--accent);display:grid;place-items:center;font-size:24px;font-weight:800}
.bt{font-size:40px;font-weight:800;font-variant-numeric:tabular-nums;margin-bottom:4px}
.bhint{color:var(--muted);font-size:14px;margin-bottom:14px}
.reason{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:18px 20px}
.reason h3,.alts h3{margin:0 0 8px;font-size:17px}
.reason p{margin:0 0 12px;word-break:break-word;white-space:pre-wrap}
.reason .btn{padding:12px;font-size:16px;background:var(--surface2)}
.alts{margin-top:14px}
.alt{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:10px;display:flex;gap:12px;align-items:center}
.alt .n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-weight:700;color:var(--accent)}

.ptimer{text-align:center}
.pmode{display:flex;gap:8px;justify-content:center;margin-bottom:10px}
.pt{font-size:78px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.prow{display:flex;gap:10px;margin-top:14px}
.prow .btn{flex:1}
.prow .sec{background:var(--surface2)}
.chart{display:flex;gap:6px;align-items:flex-end;height:160px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;height:100%}
.bar2{flex:1;width:100%;background:var(--surface2);border-radius:8px;display:flex;align-items:flex-end;overflow:hidden}
.bar2 i{display:block;width:100%;background:var(--accent);border-radius:8px 8px 0 0}
.bl{font-size:11px;color:var(--muted);margin-top:4px;white-space:nowrap}
.bv{font-size:11px;height:18px;color:var(--muted)}

.rowbtn{display:flex;align-items:center;justify-content:space-between;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin-bottom:10px;text-align:start;font-size:18px}
.rowbtn small{color:var(--muted);font-size:14px;display:block}
.rowbtn span.ch{color:var(--muted);font-size:22px}
.lvl{display:block;width:100%;margin-top:14px;padding:12px 16px;background:var(--surface);border:1px solid var(--line);border-radius:18px;text-align:center;color:var(--muted);font-size:15px}
.remind{margin-bottom:14px;background:var(--surface2);border:1px solid var(--line);border-radius:18px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.remind button{color:var(--accent);font-weight:700;padding:4px 8px}
.badges{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.badge{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px 10px;text-align:center}
.badge .bi{font-size:34px;line-height:1.2}
.badge.lock{opacity:.4;filter:grayscale(1)}
.badge b{display:block}
.badge small{color:var(--muted)}
.moods{display:flex;gap:8px;margin-bottom:14px}
.mood{flex:1;font-size:30px;padding:10px 0;border-radius:16px;background:var(--surface2);border:2px solid transparent}
.mood.on{border-color:var(--accent);background:var(--surface)}
.hb{margin-bottom:10px}
.hb .hl{display:flex;justify-content:space-between;font-size:15px;margin-bottom:4px}
.hb .hbar{height:10px;background:var(--surface2);border-radius:99px;overflow:hidden}
.hb .hbar i{display:block;height:100%;background:var(--accent)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px 12px;text-align:center}
.stat b{display:block;font-size:30px;line-height:1.2}
.stat span{color:var(--muted);font-size:14px}
.entry{border-top:1px solid var(--line);padding:10px 0}
.entry:first-child{border-top:0}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav"></nav>
<div id="layer"></div>
<div id="toast"></div>

<script>
const KEY='streak-app-v1';
const TRIGGERS=['ملل','توتر','وقت متأخر','وحدة','شيء آخر'];
const QUOTES=[
  'كل يوم جديد هو بداية جديدة.',
  'الرغبة موجة، ترتفع ثم تنزل. اصبر عليها وتمرّ.',
  'أنت أقوى مما تظن، وأثبتّ هذا بأيامك السابقة.',
  'خطوة صغيرة كل يوم أفضل من قفزة ثم توقف.',
  'الانضباط هو أن تختار ما تريده أكثر على ما تريده الآن.',
  'لا تقارن بدايتك بنهاية غيرك.',
  'التعثّر لا يمحو ما بنيته، بل يعلّمك أين تقوّي نفسك.'
];
const MILESTONES=[7,30,100,365];
const WEEKDAYS=['سبت','أحد','اثنين','ثلاثاء','أربعاء','خميس','جمعة'];
const WD_JS=['أحد','اثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت'];
const MOODS=['😞','😕','😐','🙂','😄'];
const MOOD_NAMES=['سيء جداً','سيء','عادي','جيد','ممتاز'];
const SUBS=['rewards','journal','insights','stats','settings'];
const ALTS=['امشِ خارج البيت 10 دقائق','كلّم صديق أو أرسل له رسالة','سوّي 20 ضغطة','اشرب كوب ماء كامل','غيّر مكانك فوراً واترك الجوال'];
const FLAME='<svg class="flame" viewBox="0 0 64 64" aria-hidden="true"><path d="M33 4c2 10-4 14-8 20-3 4-5 8-5 13 0 9 6 16 14 16s14-7 14-15c0-7-4-11-6-16-1 4-3 6-5 7 1-8-1-17-4-25z" fill="var(--flame)"/><path d="M31 60c-5 0-9-4-9-9 0-4 3-7 6-10 1 3 3 4 5 4 0-3-1-5-1-7 5 4 8 8 8 13 0 5-4 9-9 9z" fill="var(--bg)" opacity=".35"/></svg>';
const CHECK='<svg viewBox="0 0 24 24" fill="none" stroke="#06211d" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

const DEFAULTS=()=>({start:null,best:0,relapses:[],undo:null,days:{},bestStudy:0,reason:'',focus:{},journal:{},urges:[],theme:'auto',remind:'',remindShown:'',remindDismiss:''});
let S=load();
let tab='home';
let flow=null;
let lockTimer=null;
let statRange=7;
let cal=(()=>{const n=new Date();return{y:n.getFullYear(),m:n.getMonth()}})();

function load(){
  let d={};
  try{d=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}
  return Object.assign(DEFAULTS(),d);
}
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function applyTheme(){
  document.documentElement.dataset.theme=S.theme||'auto';
  const light=S.theme==='light'||(S.theme!=='dark'&&window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches);
  const m=document.querySelector('meta[name=theme-color]');if(m)m.content=light?'#f2f6f5':'#0f1c21';
}

/* ---------- helpers ---------- */
function pad(n){return String(n).padStart(2,'0')}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parse(s){const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])}
function todayMid(){const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())}
function todayKey(){return ymd(todayMid())}
function daysSince(s){return Math.max(0,Math.round((todayMid()-parse(s))/864e5))}
function ar(n){return String(n)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function newId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function lastDays(n){const out=[];for(let i=n-1;i>=0;i--){const d=todayMid();d.setDate(d.getDate()-i);out.push(ymd(d))}return out}
function fmtMin(m){return m<60?m+'د':(Math.round(m/6)/10)+'س'}
function mmss(s){return Math.floor(s/60)+':'+pad(s%60)}
function bars(items,fmt){
  const max=Math.max(1,...items.map(i=>i.v));
  return '<div class="chart">'+items.map(i=>`<div class="col"><div class="bv">${i.v?fmt(i.v):''}</div><div class="bar2"><i style="height:${Math.round(i.v/max*100)}%"></i></div><div class="bl">${i.l}</div></div>`).join('')+'</div>';
}
function beep(){
  try{const c=new (window.AudioContext||window.webkitAudioContext)();const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=660;g.gain.setValueAtTime(.2,c.currentTime);o.start();o.stop(c.currentTime+.45)}catch(e){}
}

/* ---------- study data ---------- */
function dayGet(k){return S.days[k]||{tasks:[]}}
function dayRef(k){return S.days[k]||(S.days[k]={tasks:[]})}
function isOk(k){const t=dayGet(k).tasks;return t.length>0&&t.every(x=>x.done)}
function isFail(k){const t=dayGet(k).tasks;return k<todayKey()&&t.length>0&&!t.every(x=>x.done)}
function studyStreak(){
  let n=0;const c=todayMid();
  if(isOk(ymd(c)))n++;
  c.setDate(c.getDate()-1);
  while(isOk(ymd(c))){n++;c.setDate(c.getDate()-1)}
  return n;
}
function bestStudyCalc(){
  const keys=Object.keys(S.days).filter(isOk).sort();
  let best=0,run=0,prev=null;
  for(const k of keys){
    if(prev&&Math.round((parse(k)-parse(prev))/864e5)===1)run++;else run=1;
    best=Math.max(best,run);prev=k;
  }
  return best;
}
function curClean(){return (S.start&&parse(S.start)<=todayMid())?daysSince(S.start):0}
function bestClean(){return Math.max(S.best||0,curClean())}
function totalCleanDays(){return S.relapses.reduce((a,r)=>a+(r.days||0),0)+curClean()}
function focusTotal(){return Object.values(S.focus).reduce((a,b)=>a+b,0)}
function points(){
  return totalCleanDays()*10+Object.keys(S.days).filter(isOk).length*20+Math.round(focusTotal()/25)*5+Object.keys(S.journal).length*5;
}
function levelInfo(){
  const p=points(),lvl=Math.floor(p/100)+1;
  const name=lvl<3?'مبتدئ':lvl<6?'مثابر':lvl<10?'منضبط':lvl<15?'صلب':'أسطورة';
  return{p,lvl,into:p%100,name};
}
function cheer(n){
  if(n===0)return 'اليوم الأول هو الأصعب، وأنت بدأت.';
  if(n<3)return 'بداية ممتازة، كمّل.';
  if(n<7)return 'أنت تبني عادة جديدة، استمر.';
  if(n<30)return 'أسبوع وأكثر! أنت أقوى مما كنت.';
  if(n<100)return 'شهر كامل وأكثر. فخور بك.';
  return 'رقم استثنائي. أنت قدوة لنفسك.';
}

/* ---------- shell ---------- */
function icon(name){
  const a='fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"';
  if(name==='home')return `<svg viewBox="0 0 24 24" ${a}><path d="M12 3c1 4-3 6-3 10a3 3 0 006 0c0-2-1-3-1-5 3 2 5 5 5 8a7 7 0 11-14 0c0-6 5-8 7-13z"/></svg>`;
  if(name==='tasks')return `<svg viewBox="0 0 24 24" ${a}><path d="M4 6l2 2 3-3M4 13l2 2 3-3M4 20l2 2 3-3" transform="translate(0 -3)"/><path d="M13 6h8M13 13h8M13 20h8" transform="translate(0 -1)"/></svg>`;
  if(name==='focus')return `<svg viewBox="0 0 24 24" ${a}><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg>`;
  if(name==='cal')return `<svg viewBox="0 0 24 24" ${a}><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>`;
  return `<svg viewBox="0 0 24 24" ${a}><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>`;
}
function renderNav(){
  const nav=document.getElementById('nav');
  if(!S.start||sos.open){nav.innerHTML='';return}
  const act=SUBS.includes(tab)?'more':tab;
  const items=[['home','الرئيسية'],['tasks','المهام'],['focus','التركيز'],['cal','التقويم'],['more','المزيد']];
  nav.innerHTML='<div class="in">'+items.map(([k,l])=>`<button data-tab="${k}" class="${act===k?'on':''}" ${act===k?'aria-current="page"':''}>${icon(k)}<span>${l}</span></button>`).join('')+'</div>';
  nav.querySelectorAll('button').forEach(b=>b.onclick=()=>go(b.dataset.tab));
}
function go(t){tab=t;render();window.scrollTo(0,0)}

function render(){
  const app=document.getElementById('app');
  renderNav();
  if(!S.start){
    app.innerHTML=`<div class="setup">
      <h2>Streek</h2>
      <p>متى بدأت الإقلاع؟ سنحسب أيامك تلقائياً من هذا التاريخ.</p>

      <button class="btn primary" id="go">ابدأ</button>
    </div>`;
    document.getElementById('go').onclick=()=>{
      S.start=document.getElementById('d0').value||ymd(new Date());save();render();

    return;

  const map={home:renderHome,tasks:renderTasks,focus:renderFocus,cal:renderCal,more:renderMore,rewards:renderRewards,journal:renderJournal,insights:renderInsights,stats:renderStats,settings:renderSettings};

/* ---------- home ---------- */
function reminderDue(){
  if(!S.remind)return false;
  const n=new Date(),p=S.remind.split(':').map(Number);
  if(n.getHours()*60+n.getMinutes()<p[0]*60+p[1])return false;
  if(S.remindDismiss===todayKey())return false;
  const t=dayGet(todayKey()).tasks;
  return !(t.length>0&&t.every(x=>x.done));
}
function renderHome(app){
  const waiting=parse(S.start)>todayMid();
  const q=QUOTES[Math.floor(todayMid()/864e5)%QUOTES.length];
  let habit='';
  if(waiting){
    const wait=Math.round((parse(S.start)-todayMid())/864e5);
    const when=parse(S.start).toLocaleDateString('ar-u-nu-latn',{day:'numeric',month:'long'});
    habit=`<section class="hero" aria-label="العدّ التنازلي">
      <p class="unit" style="margin-top:6px">يبدأ العدّ بعد</p>
      <div class="num">${ar(wait)}</div>
      <p class="unit">يوم</p>
      <span class="best">بداية التحدي: ${when}</span>
      <p class="cheer">استعد، وبكرة تكتب أول يوم.</p>
    </section>`;
  }else{
    const cur=daysSince(S.start);
    if(cur>S.best){S.best=cur;save()}
    const next=MILESTONES.find(m=>m>cur);
    const prev=[0].concat(MILESTONES).filter(m=>m<=cur).pop();
    const pct=next?Math.round((cur-prev)/(next-prev)*100):100;
    habit=`<section class="hero" aria-label="عدّاد الأيام">
      ${FLAME}
      <div class="num">${ar(cur)}</div>
      <p class="unit">يوم بدون العادة</p>
      <span class="best">أفضل رقم: ${ar(S.best)} يوم</span>
      <p class="cheer">${cheer(cur)}</p>
      ${next?`<div class="bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>
      <div class="barlabel">باقي ${ar(next-cur)} يوم للشارة ${ar(next)}</div>`:''}
    </section>`;
  }
  const sNow=studyStreak();
  S.bestStudy=Math.max(S.bestStudy||0,bestStudyCalc(),sNow);save();
  const tasks=dayGet(todayKey()).tasks;
  const done=tasks.filter(x=>x.done).length;
  const goText=tasks.length?`مهام اليوم<br>${ar(done)} من ${ar(tasks.length)}`:'أضف مهام اليوم';
  const L=levelInfo();
  app.innerHTML=`
    <div class="top"><h1>Streek</h1></div>
    ${reminderDue()?'<div class="remind"><span>⏰ ما كمّلت مهام اليوم بعد.</span><button id="rdis">إخفاء</button></div>':''}
    ${habit}
    <button class="sosbtn" id="sosBtn" aria-label="SOS طوارئ">SOS</button>
    <section class="study" aria-label="ستريك الدراسة">
      <div>
        <div class="snum">${ar(sNow)}</div>
        <div class="slabel">يوم التزام بالجدول</div>
        <span class="best">أفضل رقم: ${ar(S.bestStudy)} يوم</span>
      </div>
      <button class="go" id="goTasks">${goText}</button>
    </section>
    <div class="quote">${q}</div>
    <button class="lvl" id="goRew">المستوى ${L.lvl} · ${L.name} · ${L.p} نقطة</button>
    <button class="link" id="editStart">تعديل تاريخ البداية</button>
    ${waiting?'':'<button class="relapse" id="relapse">سجّلت انتكاسة</button>'}`;
  document.getElementById('sosBtn').onclick=openSOS;
  document.getElementById('goTasks').onclick=()=>go('tasks');
  document.getElementById('goRew').onclick=()=>go('rewards');

  if(rd)rd.onclick=()=>{S.remindDismiss=todayKey();save();render()};
  const r=document.getElementById('relapse');

/* ---------- tasks ---------- */
function renderTasks(app){
  const key=todayKey();
  const tasks=dayGet(key).tasks;
  const done=tasks.filter(x=>x.done).length;
  const pct=tasks.length?Math.round(done/tasks.length*100):0;
  const dateTxt=new Date().toLocaleDateString('ar-u-nu-latn',{weekday:'long',day:'numeric',month:'long'});
  const y=new Date();y.setDate(y.getDate()-1);
  const yTasks=dayGet(ymd(y)).tasks;
  let list='';
  if(tasks.length){
    list=tasks.map(t=>`<div class="task${t.done?' done':''}">
      <button class="chk${t.done?' on':''}" data-id="${t.id}" role="checkbox" aria-checked="${t.done}" aria-label="${esc(t.t)}">${CHECK}</button>
      <span class="tt">${esc(t.t)}</span>
      <button class="edit" data-edit="${t.id}">تعديل</button>
    </div>`).join('');
  }else{
    list=`<div class="empty">ما أضفت مهام لليوم.<br>أضف أول مهمة دراسية وابدأ يومك.</div>`;
    if(yTasks.length)list+=`<button class="btn small" id="copyY">نسخ مهام أمس (${ar(yTasks.length)})</button>`;
  }
  app.innerHTML=`
    <div class="top"><h1>مهام اليوم</h1><small>${dateTxt}</small></div>
    <div class="prog">
      <div class="t"><span>التقدّم</span><span>${ar(done)} من ${ar(tasks.length)}</span></div>
      <div class="bar" style="margin:10px 0 0"><i style="width:${pct}%"></i></div>
      ${tasks.length&&done===tasks.length?'<div class="win">يوم ناجح! زاد ستريك الدراسة.</div>':''}
    </div>
    ${list}
    <button class="btn primary addbtn" id="addT">+ أضف مهمة</button>`;
  app.querySelectorAll('.chk').forEach(b=>b.onclick=()=>{
    const t=dayRef(key).tasks.find(x=>x.id===b.dataset.id);
    if(t){t.done=!t.done;save();render()}
  });
  app.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openTask(b.dataset.edit));
  document.getElementById('addT').onclick=()=>openTask(null);
  const c=document.getElementById('copyY');
  if(c)c.onclick=()=>{
    dayRef(key).tasks=yTasks.map(t=>({id:newId(),t:t.t,done:false}));
    save();render();
  };
}
function openTask(id){
  const key=todayKey();
  const t=id?dayGet(key).tasks.find(x=>x.id===id):null;
  sheet(`<h2>${t?'تعديل المهمة':'مهمة جديدة'}</h2>
    <input type="text" id="tt" maxlength="80" placeholder="مثال: مراجعة درس النحو" value="${t?esc(t.t):''}">
    <button class="btn primary" id="ts">حفظ</button>
    ${t?'<button class="btn small" id="td">حذف المهمة</button>':''}
    <button class="btn small" id="tc">إلغاء</button>`);
  const inp=document.getElementById('tt');
  setTimeout(()=>inp.focus(),50);
  const saveIt=()=>{
    const v=inp.value.trim();
    if(!v){inp.focus();return}
    const d=dayRef(key);
    if(t){const x=d.tasks.find(z=>z.id===id);if(x)x.t=v}
    else d.tasks.push({id:newId(),t:v,done:false});
    save();closeSheet();render();
  };
  document.getElementById('ts').onclick=saveIt;
  inp.onkeydown=e=>{if(e.key==='Enter')saveIt()};
  document.getElementById('tc').onclick=closeSheet;
  const del=document.getElementById('td');
  if(del)del.onclick=()=>{
    const d=dayRef(key);d.tasks=d.tasks.filter(z=>z.id!==id);
    save();closeSheet();render();
  };
}

/* ---------- focus (pomodoro) ---------- */
const pomo={mode:'focus',running:false,left:1500,endAt:0,iv:null};
function pomoTotal(){return pomo.mode==='focus'?1500:300}
function pomoStart(){
  if(pomo.running)return;
  pomo.running=true;pomo.endAt=Date.now()+pomo.left*1000;
  pomo.iv=setInterval(pomoTick,500);pomoUI();
}
function pomoPause(){
  if(!pomo.running)return;
  pomo.left=Math.max(0,Math.round((pomo.endAt-Date.now())/1000));
  pomo.running=false;clearInterval(pomo.iv);pomoUI();
}
function pomoReset(){clearInterval(pomo.iv);pomo.running=false;pomo.left=pomoTotal();pomoUI()}
function pomoSetMode(m){clearInterval(pomo.iv);pomo.running=false;pomo.mode=m;pomo.left=pomoTotal();render()}
function pomoTick(){
  const left=Math.max(0,Math.round((pomo.endAt-Date.now())/1000));
  pomo.left=left;pomoUI();
  if(left<=0)pomoDone();
}
function pomoDone(){
  clearInterval(pomo.iv);pomo.running=false;
  if(pomo.mode==='focus'){
    const k=todayKey();S.focus[k]=(S.focus[k]||0)+25;save();
    pomo.mode='break';pomo.left=300;
  }else{pomo.mode='focus';pomo.left=1500}
  beep();if(navigator.vibrate)navigator.vibrate([300,150,300]);
  if(tab==='focus'&&!sos.open)render();
}
function pomoUI(){
  const t=document.getElementById('pt');if(!t)return;
  t.textContent=mmss(pomo.left);
  const g=document.getElementById('pgo');if(g)g.textContent=pomo.running?'إيقاف مؤقت':(pomo.left<pomoTotal()?'استمرار':'ابدأ');
  const b=document.getElementById('pbar');if(b)b.style.width=Math.round((1-pomo.left/pomoTotal())*100)+'%';
}
function renderFocus(app){
  const k=todayKey();
  const week=lastDays(7).map(d=>({l:WD_JS[parse(d).getDay()],v:S.focus[d]||0}));
  const wk=week.reduce((a,b)=>a+b.v,0);
  app.innerHTML=`
    <div class="top"><h1>التركيز</h1></div>
    <section class="card ptimer">
      <div class="pmode">
        <button class="chip${pomo.mode==='focus'?' on':''}" id="mF">تركيز 25د</button>
        <button class="chip${pomo.mode==='break'?' on':''}" id="mB">استراحة 5د</button>
      </div>
      <div class="pt" id="pt">${mmss(pomo.left)}</div>
      <div class="bar" style="margin:12px 6px 0"><i id="pbar" style="width:${Math.round((1-pomo.left/pomoTotal())*100)}%"></i></div>
      <div class="prow">
        <button class="btn primary" id="pgo">${pomo.running?'إيقاف مؤقت':(pomo.left<pomoTotal()?'استمرار':'ابدأ')}</button>
        <button class="btn sec" id="prs">إعادة</button>
      </div>
      <p class="muted" style="margin:12px 0 0;font-size:14px">كل جلسة تركيز كاملة تنضاف لساعات دراستك.</p>
    </section>
    <section class="card">
      <h3>دراسة اليوم: ${fmtMin(S.focus[k]||0)}</h3>
      <div class="muted" style="font-size:14px;margin-bottom:10px">آخر 7 أيام · المجموع ${fmtMin(wk)}</div>
      ${bars(week,fmtMin)}
    </section>`;
  document.getElementById('mF').onclick=()=>pomoSetMode('focus');
  document.getElementById('mB').onclick=()=>pomoSetMode('break');
  document.getElementById('pgo').onclick=()=>pomo.running?pomoPause():pomoStart();
  document.getElementById('prs').onclick=pomoReset;
}

/* ---------- calendar ---------- */
function renderCal(app){
  const first=new Date(cal.y,cal.m,1);
  const days=new Date(cal.y,cal.m+1,0).getDate();
  const offset=(first.getDay()+1)%7;
  const tk=todayKey();
  const relapseDays=new Set(S.relapses.map(r=>ymd(new Date(r.date))));
  let cells=WEEKDAYS.map(w=>`<div class="wd">${w}</div>`).join('');
  for(let i=0;i<offset;i++)cells+='<div class="cell blank"></div>';
  for(let d=1;d<=days;d++){
    const k=cal.y+'-'+pad(cal.m+1)+'-'+pad(d);
    let cls='cell';
    if(isOk(k))cls+=' ok';else if(isFail(k))cls+=' fail';
    if(k===tk)cls+=' today';
    const lab=isOk(k)?'يوم ناجح':isFail(k)?'يوم غير مكتمل':'';
    cells+=`<div class="${cls}" ${lab?`aria-label="${d}: ${lab}"`:''}>${d}${relapseDays.has(k)?'<span class="dot"></span>':''}</div>`;
  }
  const title=first.toLocaleDateString('ar-u-nu-latn',{month:'long',year:'numeric'});
  app.innerHTML=`
    <div class="top"><h1>التقويم</h1></div>
    <div class="calhead">
      <button class="arrow" id="prevM" aria-label="الشهر السابق">›</button>
      <h2>${title}</h2>
      <button class="arrow" id="nextM" aria-label="الشهر التالي">‹</button>
    </div>
    <div class="grid">${cells}</div>
    <div class="legend">
      <span><i style="background:var(--ok)"></i>أنجزت كل المهام</span>
      <span><i style="background:var(--fail)"></i>مهام ناقصة</span>
      <span><i style="background:var(--flame);border-radius:50%"></i>يوم انتكاسة</span>
    </div>`;
  document.getElementById('prevM').onclick=()=>{cal.m--;if(cal.m<0){cal.m=11;cal.y--}render()};
  document.getElementById('nextM').onclick=()=>{cal.m++;if(cal.m>11){cal.m=0;cal.y++}render()};
}

/* ---------- insights ---------- */
function bucket(h){return h>=5&&h<12?'الصباح':h<17&&h>=12?'الظهر':h>=17&&h<21?'المساء':'الليل'}
function renderInsights(app){
  const ev=S.relapses.map(r=>({t:r.date,trigger:r.trigger})).concat(S.urges.map(u=>({t:u.t,trigger:u.trigger})));
  let body='';
  if(!ev.length){
    body='<div class="empty">ما فيه بيانات كافية بعد.<br>سجّل الرغبات من اليوميات، وتظهر لك الأنماط هنا.</div>';
  }else{
    const tc={};ev.forEach(e=>tc[e.trigger]=(tc[e.trigger]||0)+1);
    const tl=Object.entries(tc).sort((a,b)=>b[1]-a[1]);
    const mx=tl[0][1];
    const bc={'الصباح':0,'الظهر':0,'المساء':0,'الليل':0};
    ev.forEach(e=>bc[bucket(new Date(e.t).getHours())]++);
    const bl=Object.entries(bc).sort((a,b)=>b[1]-a[1]);
    const row=(n,v,m)=>`<div class="hb"><div class="hl"><span>${esc(n)}</span><span>${v}</span></div><div class="hbar"><i style="width:${Math.round(v/m*100)}%"></i></div></div>`;
    body=`<section class="card"><h3>أكثر المحفّزات</h3>${tl.map(x=>row(x[0],x[1],mx)).join('')}</section>
      <section class="card"><h3>أسوأ الأوقات</h3>${bl.map(x=>row(x[0],x[1],Math.max(1,bl[0][1]))).join('')}
        <div class="muted" style="font-size:14px">الوقت الأصعب عندك: <b style="color:var(--text)">${bl[0][0]}</b></div></section>`;
  }
  const md=lastDays(7).map(d=>S.journal[d]&&S.journal[d].mood).filter(Boolean);
  const avg=md.length?(md.reduce((a,b)=>a+b,0)/md.length):0;
  app.innerHTML=subTop('الأنماط')+body+(md.length?`<section class="card"><h3>مزاجك آخر 7 أيام</h3><div style="font-size:34px">${MOODS[Math.round(avg)-1]}</div><div class="muted">المتوسط ${avg.toFixed(1)} من 5</div></section>`:'');
  bindSub();
}

/* ---------- stats ---------- */
function renderStats(app){
  const days=lastDays(statRange);
  const withT=days.filter(d=>dayGet(d).tasks.length>0);
  const okN=withT.filter(isOk).length;
  const rate=withT.length?Math.round(okN/withT.length*100)+'%':'—';
  const rel=S.relapses.filter(r=>days.includes(ymd(new Date(r.date)))).length;
  const mins=days.reduce((a,d)=>a+(S.focus[d]||0),0);
  const bs=Math.max(S.bestStudy||0,bestStudyCalc(),studyStreak());
  app.innerHTML=subTop('الإحصائيات')+`
    <div class="chips"><button class="chip${statRange===7?' on':''}" id="r7">أسبوع</button><button class="chip${statRange===30?' on':''}" id="r30">شهر</button></div>
    <div class="stats">
      <div class="stat"><b>${rate}</b><span>نسبة نجاح الأيام</span></div>
      <div class="stat"><b>${rel}</b><span>عدد الانتكاسات</span></div>
      <div class="stat"><b>${fmtMin(mins)}</b><span>ساعات الدراسة</span></div>
      <div class="stat"><b>${okN}</b><span>أيام ناجحة</span></div>
      <div class="stat"><b>${bestClean()}</b><span>أطول ستريك نظيف</span></div>
      <div class="stat"><b>${bs}</b><span>أطول التزام بالجدول</span></div>
    </div>`;
  document.getElementById('r7').onclick=()=>{statRange=7;render()};
  document.getElementById('r30').onclick=()=>{statRange=30;render()};
  bindSub();
}

/* ---------- settings ---------- */
function renderSettings(app){
  const th=S.theme||'auto';
  const perm=('Notification' in window)?Notification.permission:'unsupported';
  app.innerHTML=subTop('الإعدادات')+`
    <section class="card"><h3>المظهر</h3>
      <div class="chips" style="margin:0">
        <button class="chip${th==='auto'?' on':''}" data-th="auto">تلقائي</button>
        <button class="chip${th==='dark'?' on':''}" data-th="dark">داكن</button>
        <button class="chip${th==='light'?' on':''}" data-th="light">فاتح</button>
      </div></section>
    <section class="card"><h3>تذكير يومي</h3>
      <input type="time" id="rt" value="${S.remind||''}" aria-label="وقت التذكير">
      <div class="muted" style="font-size:14px;margin-bottom:10px">يظهر تنبيه في الرئيسية بعد هذا الوقت لو ما كمّلت مهامك. الإشعارات تشتغل وأنت فاتح التطبيق فقط.</div>
      ${perm==='default'?'<button class="btn" id="notif" style="background:var(--surface2);padding:12px;font-size:16px">فعّل الإشعارات</button>':perm==='granted'?'<div class="muted" style="font-size:14px">الإشعارات مفعّلة.</div>':''}
    </section>
    <section class="card"><h3>تاريخ البداية</h3>
      <div class="muted" style="margin-bottom:10px">${S.start}</div>
      <button class="btn" id="sdt" style="background:var(--surface2);padding:12px;font-size:16px">تعديل</button></section>
    <section class="card"><h3>سبب إقلاعي</h3>
      <div style="white-space:pre-wrap;word-break:break-word;margin-bottom:10px">${S.reason?esc(S.reason):'<span class="muted">ما كتبت سبب بعد.</span>'}</div>
      <button class="btn" id="rsn" style="background:var(--surface2);padding:12px;font-size:16px">${S.reason?'تعديل':'اكتب سببي'}</button></section>
    <section class="card"><h3>نسخة احتياطية</h3>
      <div class="muted" style="font-size:14px;margin-bottom:10px">بياناتك محفوظة داخل الجوال فقط. خذ نسخة احتياطية قبل ما تمسح بيانات المتصفح.</div>
      <button class="btn" id="exp" style="background:var(--surface2);padding:12px;font-size:16px;margin-bottom:10px">تصدير نسخة</button>
      <button class="btn" id="imp" style="background:var(--surface2);padding:12px;font-size:16px">استيراد نسخة</button>
      <input type="file" id="impf" accept="application/json,.json" hidden>
    </section>`;
  document.querySelectorAll('[data-th]').forEach(b=>b.onclick=()=>{S.theme=b.dataset.th;save();applyTheme();render()});
  document.getElementById('rt').onchange=e=>{S.remind=e.target.value;S.remindDismiss='';save()};
  const n=document.getElementById('notif');
  if(n)n.onclick=()=>Notification.requestPermission().then(()=>render());
  document.getElementById('sdt').onclick=openEdit;
  document.getElementById('rsn').onclick=openReason;
  document.getElementById('exp').onclick=exportData;
  document.getElementById('imp').onclick=()=>document.getElementById('impf').click();
  document.getElementById('impf').onchange=e=>importData(e.target.files[0]);
  bindSub();
}
function exportData(){
  const b=new Blob([JSON.stringify(S)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='streek-backup-'+todayKey()+'.json';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function importData(f){
  if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    let o=null;try{o=JSON.parse(r.result)}catch(e){}
    if(!o||typeof o!=='object'||Array.isArray(o)){sheet('<h2>الملف غير صالح</h2><p>اختر ملف نسخة احتياطية من Streek.</p><button class="btn primary" id="ok">حسناً</button>');document.getElementById('ok').onclick=closeSheet;return}
    sheet(`<h2>استيراد النسخة؟</h2><p>بيستبدل كل بياناتك الحالية بالنسخة اللي اخترتها.</p>
      <button class="btn primary" id="yes">نعم، استورد</button><button class="btn small" id="no">إلغاء</button>`);
    document.getElementById('no').onclick=closeSheet;
    document.getElementById('yes').onclick=()=>{S=Object.assign(DEFAULTS(),o);save();applyTheme();closeSheet();render()};
  };
  r.readAsText(f);
}

/* ---------- SOS ---------- */
const sos={open:false,end:0,iv:null,done:false,list:null,last:-1};
let breath=null;
function probeSos(){
  if(sos.list)return Promise.resolve(sos.list);
  const ps=[];
  for(let i=1;i<=10;i++){
    ps.push(fetch('sos'+i+'.m4a',{method:'HEAD'}).then(r=>r.ok?'sos'+i+'.m4a':null).catch(()=>null));
  }
  return Promise.all(ps).then(a=>{sos.list=a.filter(Boolean);return sos.list});
}
function openSOS(){
  sos.open=true;sos.done=false;sos.end=Date.now()+300000;
  render();window.scrollTo(0,0);
}
function closeSOS(){
  clearInterval(sos.iv);clearInterval(breath);breath=null;
  const v=document.getElementById('sv');if(v)v.pause();
  sos.open=false;render();window.scrollTo(0,0);
}
function reasonBox(){
  return S.reason?`<h3>سبب إقلاعي</h3><p>${esc(S.reason)}</p><button class="btn" id="editReason">تعديل</button>`
    :`<h3>سبب إقلاعي</h3><p class="muted">اكتب سببك الحين، وارجع له وقت الضعف.</p><button class="btn" id="editReason">اكتب سبب إقلاعي</button>`;
}
function renderSOS(app){
  const waiting=parse(S.start)>todayMid();
  const cur=waiting?0:daysSince(S.start);
  app.innerHTML=`
    <div class="top"><h1>SOS</h1><button class="back" id="sosBack" disabled>خروج</button></div>
    <section class="lock" id="lock"></section>
    <div class="vwrap" id="vwrap"></div>
    <section class="hero sosc">
      <p class="unit" style="margin:0 0 6px">الرغبة موجة، وبتمرّ.</p>
      <p class="cheer" style="margin:0">${waiting?'قرارك يستاهل، كمّل.':`وصلت إلى <b>${cur}</b> يوم. لا تضيّعها على لحظة.`}</p>
    </section>
    <section class="breath" aria-label="تمرين التنفس">
      <div class="orb" id="orb"><span id="bphase">جاهز؟</span></div>
      <div class="bt" id="bt">60</div>
      <div class="bhint">شهيق 4 ثواني، زفير 6 ثواني</div>
      <button class="btn primary" id="bstart">ابدأ التنفس</button>
      <button class="btn small" id="breset">إعادة</button>
    </section>
    <section class="reason" id="reasonbox">${reasonBox()}</section>
    <section class="alts"><h3>جرّب واحد من هذي الحين</h3>
      ${ALTS.map((a,i)=>`<div class="alt"><span class="n">${i+1}</span><span>${a}</span></div>`).join('')}
    </section>`;
  document.getElementById('sosBack').onclick=closeSOS;
  document.getElementById('editReason').onclick=openReason;
  document.getElementById('bstart').onclick=startBreath;
  document.getElementById('breset').onclick=()=>{clearInterval(breath);breath=null;const o=document.getElementById('orb');o.style.transition='none';o.style.transform='scale(1)';document.getElementById('bphase').textContent='جاهز؟';document.getElementById('bt').textContent='60';const b=document.getElementById('bstart');b.disabled=false;b.textContent='ابدأ التنفس'};
  setupLock();loadVideo();
}
function setupLock(){
  clearInterval(sos.iv);
  if(sos.done||Date.now()>=sos.end){finishLock();return}
  document.getElementById('lock').innerHTML=`<div class="lt">خذ نفس، لا تتسرّع</div><div class="lnum" id="lnum">5:00</div><div class="bhint" style="margin:6px 0 0">زر الخروج يفتح بعد انتهاء العدّاد.</div>`;
  const tick=()=>{
    const left=Math.ceil((sos.end-Date.now())/1000);
    if(left<=0){finishLock();return}
    const n=document.getElementById('lnum'),b=document.getElementById('sosBack');
    if(n)n.textContent=mmss(left);
    if(b)b.textContent='خروج ('+mmss(left)+')';
  };
  tick();sos.iv=setInterval(tick,1000);
}
function finishLock(){
  clearInterval(sos.iv);sos.done=true;
  const l=document.getElementById('lock'),b=document.getElementById('sosBack');
  if(b){b.disabled=false;b.textContent='خروج'}
  if(!l)return;
  l.innerHTML=`<div class="lt">أحسنت! عدّت الموجة 🌊</div>
    <p class="muted" style="margin:6px 0 10px">وش كان المحفّز؟ (اختياري)</p>
    <div class="chips" id="uch" style="justify-content:center;margin:0">${TRIGGERS.map(t=>`<button class="chip" data-t="${t}">${t}</button>`).join('')}</div>
    <div id="umsg" class="muted" style="margin-top:8px"></div>`;
  l.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{
    S.urges.push({id:newId(),t:new Date().toISOString(),trigger:c.dataset.t,note:''});save();
    document.getElementById('uch').innerHTML='';
    document.getElementById('umsg').textContent='تم تسجيل الرغبة. فخور بك.';
  });
}
function loadVideo(){
  const w=document.getElementById('vwrap');
  probeSos().then(list=>{
    const w=document.getElementById('vwrap');if(!w||!sos.open)return;
    if(!list.length){w.innerHTML='<div class="muted" style="font-size:14px">ما فيه مقاطع بعد. ارفع sos1.m4a وما بعده على GitHub لتظهر هنا.</div>';return}
    const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
    let queue=shuffle(list);
    const pick=()=>{
      if(!queue.length){
        queue=shuffle(list);
        if(list.length>1&&queue[0]===sos.lastFile)queue.push(queue.shift());
      }
      const f=queue.shift();sos.lastFile=f;return f;
    };
    w.innerHTML=`<div class="aud"><div class="ai">🎧</div><div class="muted" style="font-size:14px;margin-bottom:8px">يشتغل مقطع عشوائي، وإذا خلص ينتقل لغيره</div><audio id="sv" controls preload="auto" src="${pick()}"></audio></div>`;
    const v=document.getElementById('sv');
    v.onended=()=>{v.src=pick();v.play().catch(()=>{})};
    v.play().catch(()=>{});
  });
}
function startBreath(){
  clearInterval(breath);
  const orb=document.getElementById('orb'),ph=document.getElementById('bphase'),bt=document.getElementById('bt'),btn=document.getElementById('bstart');
  const calm=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  let left=60;
  btn.disabled=true;btn.textContent='جارٍ التنفس...';
  const inhale=()=>{ph.textContent='شهيق';if(!calm){orb.style.transition='transform 4s linear';orb.style.transform='scale(1.3)'}};
  const exhale=()=>{ph.textContent='زفير';if(!calm){orb.style.transition='transform 6s linear';orb.style.transform='scale(1)'}};
  bt.textContent=left;inhale();
  breath=setInterval(()=>{
    left--;bt.textContent=Math.max(left,0);
    if(left<=0){
      clearInterval(breath);breath=null;
      ph.textContent='أحسنت';orb.style.transform='scale(1)';
      btn.disabled=false;btn.textContent='ابدأ من جديد';
      return;
    }
    const t=(60-left)%10;
    if(t===0)inhale();else if(t===4)exhale();
  },1000);
}
function openReason(){
  sheet(`<h2>سبب إقلاعي</h2><p>اكتب بكلماتك ليش قررت تترك هالعادة. بتشوفه هنا وقت الرغبة.</p>
    <textarea id="rs" maxlength="300" placeholder="مثال: أبي أركّز في دراستي وأحترم نفسي"></textarea>
    <button class="btn primary" id="rsv">حفظ</button>
    <button class="btn small" id="rcx">إلغاء</button>`);
  const t=document.getElementById('rs');t.value=S.reason||'';
  document.getElementById('rcx').onclick=closeSheet;
  document.getElementById('rsv').onclick=()=>{
    S.reason=t.value.trim();save();closeSheet();
    const rb=document.getElementById('reasonbox');
    if(sos.open&&rb){rb.innerHTML=reasonBox();document.getElementById('editReason').onclick=openReason}
    else render();
  };
}

/* ---------- sheets ---------- */
function sheet(html){
  const l=document.getElementById('layer');
  l.innerHTML=`<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  document.getElementById('scrim').onclick=e=>{if(e.target.id==='scrim')closeSheet()};
}
function closeSheet(){
  clearInterval(lockTimer);flow=null;
  document.getElementById('layer').innerHTML='';
}
function openEdit(){
  sheet(`<h2>تاريخ البداية</h2><p>غيّره لو بدأت قبل ما تثبّت التطبيق، أو اختر تاريخاً قادماً.</p>
    <input type="date" id="dn" value="${S.start}">
    <button class="btn primary" id="sv">حفظ</button>
    <button class="btn small" id="cx">إلغاء</button>`);
  document.getElementById('cx').onclick=closeSheet;
  document.getElementById('sv').onclick=()=>{
    const v=document.getElementById('dn').value;
    if(v){S.start=v;save()}
    closeSheet();render();
  };
}

/* ---------- relapse flow ---------- */
function drawFlow(){
  clearInterval(lockTimer);
  const cur=daysSince(S.start);
  if(flow.step===1){
    sheet(`<h2>متأكد إنك انتكست؟</h2>
      <p>عدّاد الأيام بيرجع للصفر. أفضل رقم عندك يبقى محفوظاً.</p>
      <button class="btn primary" id="back">رجوع</button>
      <button class="btn small" id="yes1">نعم، انتكست</button>`);
    document.getElementById('back').onclick=closeSheet;
    document.getElementById('yes1').onclick=()=>{flow.step=2;drawFlow()};
  }else if(flow.step===2){
    let left=5;
    sheet(`<h2>تأكيد أخير</h2>
      <p>وصلت إلى <b style="color:var(--text)">${ar(cur)} يوم</b>. بتبدأ العدّ من جديد. متأكد 100%؟</p>
      <button class="btn primary" id="back">رجوع، أكمل التحدي</button>
      <button class="btn small" id="yes2" disabled>نعم (${ar(left)})</button>`);
    document.getElementById('back').onclick=closeSheet;
    const y=document.getElementById('yes2');
    y.onclick=()=>{flow.step=3;drawFlow()};
    lockTimer=setInterval(()=>{
      left--;
      if(left<=0){clearInterval(lockTimer);y.disabled=false;y.textContent='نعم، متأكد'}
      else y.textContent='نعم ('+ar(left)+')';
    },1000);
  }else{
    sheet(`<h2>وش كان المحفّز؟</h2>
      <p>معرفة السبب تساعدك تتجنبه المرة الجاية. ما في لوم، كل يوم بداية جديدة.</p>
      <div class="chips" id="chips">${TRIGGERS.map(t=>`<button class="chip${flow.trigger===t?' on':''}" data-t="${t}">${t}</button>`).join('')}</div>
      <textarea id="note" placeholder="ملاحظة قصيرة (اختياري)"></textarea>
      <button class="btn primary" id="done">سجّل وابدأ من جديد</button>`);
    document.getElementById('note').value=flow.note;
    document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{
      flow.note=document.getElementById('note').value;
      flow.trigger=c.dataset.t;drawFlow();
    });
    document.getElementById('done').onclick=()=>{
      flow.note=document.getElementById('note').value;
      finishRelapse();
    };
  }
}
function finishRelapse(){
  const cur=daysSince(S.start);
  const id=Date.now();
  S.undo={id,prevStart:S.start,prevBest:S.best,expires:id+60000};
  S.best=Math.max(S.best,cur);
  S.relapses.push({id,date:new Date().toISOString(),trigger:flow.trigger||'غير محدد',note:flow.note||'',days:cur});
  S.start=ymd(new Date());
  save();closeSheet();render();drawToast();
}
let toastTimer=null;
function drawToast(){
  clearInterval(toastTimer);
  const t=document.getElementById('toast');
  const tick=()=>{
    if(!S.undo||Date.now()>=S.undo.expires){clearInterval(toastTimer);t.innerHTML='';if(S.undo){S.undo=null;save()}return}
    const s=Math.ceil((S.undo.expires-Date.now())/1000);
    t.innerHTML=`<div class="toast"><span>تم التسجيل. بدأت من جديد.</span><button id="undo"><b>تراجع (${ar(s)})</b></button></div>`;
    document.getElementById('undo').onclick=undo;
  };
  tick();toastTimer=setInterval(tick,1000);
}
function undo(){
  if(!S.undo)return;
  S.start=S.undo.prevStart;S.best=S.undo.prevBest;
  S.relapses=S.relapses.filter(r=>r.id!==S.undo.id);
  S.undo=null;save();
  clearInterval(toastTimer);document.getElementById('toast').innerHTML='';
  render();
}

/* ---------- reminder notification ---------- */
function checkReminder(){
  if(!S.remind)return;
  if(reminderDue()){
    if(tab==='home'&&!sos.open&&!document.getElementById('rdis')&&!document.getElementById('scrim'))render();
    if('Notification' in window&&Notification.permission==='granted'&&S.remindShown!==todayKey()){
      S.remindShown=todayKey();save();
      if(navigator.serviceWorker)navigator.serviceWorker.ready.then(r=>r.showNotification('Streek',{body:'وقت مهامك اليوم. كمّل يومك.',icon:'icon-192.png'})).catch(()=>{});
    }
  }
}

/* ---------- init ---------- */
applyTheme();
render();drawToast();
probeSos();
setInterval(checkReminder,30000);
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
</body>
</html>
